<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Multimedia</title></head>
<body>
  <h3>Image</h3>
  <img src="campus.jpg" alt="College campus" width="200" height="200">

  <h3>Video</h3>
  <video src="sample.mp4" width="260" controls>
    Your browser does not support the video tag.
  </video>

  <h3>Audio</h3>
  <audio src="sample.mp3" controls>
    Your browser does not support the audio tag.
  </audio>

  <h3>YouTube</h3>
  <iframe width="420" height="250"
          src="https://www.youtube.com/embed/VIDEO_ID"
          title="YouTube video player" allowfullscreen></iframe>
</body>
</html>
