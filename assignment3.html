<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><title>Block and Inline</title>
  <style>
    div  { background: lightblue; margin: 4px 5px; padding: 0 5px; }
    span { background: lightgreen; }
  </style>
</head>
<body>
  <div>Block 1</div>
  <div>Block 2</div>
  <span>Inline 1</span>
  <span>Inline 2</span>
  <span>Inline 3</span>
</body>
</html>
